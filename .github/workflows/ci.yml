name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Go (conformance suite runs go run)
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      - name: Go toolchain smoke (fail fast if go is not on PATH)
        run: go version

      - name: Install Node (conformance suite runs node)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Node toolchain smoke
        run: node --version

      - name: Install Lua 5.4 (native lua seat runs as lua5.4)
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Install checksum-pinned native solc 0.8.28
        run: bash .github/scripts/install-solc.sh

      - name: Build
        run: cargo build --locked --verbose

      - name: Bank hook must exist
        run: |
          ./target/debug/cuni bank --help
          ./target/debug/cuni bank paste examples/bank/add.py --from py --to py


      - name: Studio citizen PASS shape smoke
        run: python3 -m unittest playground.test_citizen_pass -v

      - name: Cross-chain Solidity compilation and exactness
        run: cargo test --locked --test proof_crosschain -- --nocapture

      - name: Test
        run: cargo test --locked --verbose
